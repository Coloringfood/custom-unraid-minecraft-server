services:
  minecraft:
    build: .
    container_name: custom-minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"   # game
      - "25575:25575"   # RCON (optional)
      - "9011:8080"     # gotty web console -> http://localhost:9011
    environment:
      # --- Launch model ---
      # Leave START_SERVER_SCRIPT empty to use the built-in generic auto-detect
      # launcher (Forge/NeoForge/Fabric/vanilla). Set it to the name (without
      # .sh) of a script IN the server dir to run that pack's own launcher.
      START_SERVER_SCRIPT: "${START_SERVER_SCRIPT:-}"

      # --- Java runtime (Temurin): basicjre=8, jre11, jre17, jre21, ... ---
      RUNTIME_NAME: "${RUNTIME_NAME:-jre17}"

      # --- Memory / JVM tuning (authoritative; ignores packs' user_jvm_args) ---
      XMX_SIZE: "${XMX_SIZE:-4096}"
      XMS_SIZE: "${XMS_SIZE:-4096}"
      EXTRA_JVM_PARAMS: "${EXTRA_JVM_PARAMS:-}"

      # --- Optional: let the generic launcher download+install Forge/NeoForge
      # for packs that ship neither an installer jar nor libraries/ ---
      MC_VERSION: "${MC_VERSION:-}"
      FORGE_VERSION: "${FORGE_VERSION:-}"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-}"

      ACCEPT_EULA: "true"
      ENABLE_WEBCONSOLE: "true"

      # --- Optional daily restart (clears memory/lag). Empty time = disabled.
      # TZ so the time below is local, not UTC. Warns players via in-game chat,
      # then lets Docker's restart policy bring a fresh container back up. ---
      TZ: "${TZ:-America/Denver}"
      AUTO_RESTART_TIME: "${AUTO_RESTART_TIME:-}"
      AUTO_RESTART_WARN: "${AUTO_RESTART_WARN:-10,5,1}"
    volumes:
      # Point at one pack's folder. Switch packs with:  PACK=ProjectArchitect2 docker compose up
      - ./serverfiles/${PACK:-DeceasedCraft}:/serverdata/serverfiles
    stop_grace_period: 60s   # give the server time to save & stop cleanly
